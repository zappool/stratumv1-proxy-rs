[package]
name = "stratumv1-proxy-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "stratumv1_proxy_rs"
path = "src/lib.rs"

[[bin]]
name = "stratumv1-proxy-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
