[package]
name = "stratumv1-proxy-rs"
description = "A Stratum V1 (Bitcoin mining protocol) proxy, written in Rust"
license = "MIT"
version = "0.2.1"
edition = "2021"

[lib]
name = "stratumv1_proxy_rs"
path = "src/lib.rs"

[[bin]]
name = "stratumv1-proxy-rs"
path = "src/main.rs"

[features]
default = []
# Expose testing stubs
teststubs = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }

[dev-dependencies]
serial_test = "3.4.0"
